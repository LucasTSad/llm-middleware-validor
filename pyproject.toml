[build-system]
requires = ["setuptools >= 68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-validator"
version = "0.1.0"
description = "Middleware local para auditoria e validacao dinamica de prompts em LLMs corporativas"
requires-python = ">= 3.11"
dependencies = [
    "pydantic >= 2.7",
    "tiktoken >= 0.7"
]

[project.optional-dependencies]
# api: ponto de entrada HTTP, trabalho futuro pelo ADR 0001. O ADR 0011
# decide se a fronteira entra no escopo, e nomeia este extra.
api = ["fastapi >= 0.115", "uvicorn >= 0.30", "httpx >= 0.27"]
dev = [
    "pytest >= 8.0",
    "pytest-benchmark >= 4.0",
    "hypothesis >= 6.100",
    "mypy >= 1.17",
    "ruff >= 0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_validator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
]

[tool.mypy]
files = ["src", "benchmarks", "scripts"]